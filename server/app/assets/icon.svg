<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- RGAS Receiver (rgas-booth) — booth PA speaker playing received audio -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17b28a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="128" rx="56" fill="url(#sheen)"/>

  <!-- speaker: cabinet + cone -->
  <rect x="50" y="98" width="34" height="60" rx="8" fill="#ffffff"/>
  <path d="M 84 98 L 128 58 L 128 198 L 84 158 Z" fill="#ffffff"/>

  <!-- emitted sound waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 154 96 a 44 44 0 0 1 0 64" stroke-width="16"/>
    <path d="M 182 72 a 76 76 0 0 1 0 112" stroke-width="16" opacity="0.55"/>
  </g>
</svg>
