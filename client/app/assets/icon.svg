<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- RGAS Soundboard (rgas-source) — soundboard pad grid, one pad pressed/playing -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df6"/>
      <stop offset="1" stop-color="#5b2fd4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="128" rx="56" fill="url(#sheen)"/>

  <!-- 2x2 pad grid; top-right pad is "pressed" (solid, playing) -->
  <rect x="48"  y="48"  width="72" height="72" rx="18" fill="#ffffff" opacity="0.45"/>
  <rect x="48"  y="136" width="72" height="72" rx="18" fill="#ffffff" opacity="0.45"/>
  <rect x="136" y="136" width="72" height="72" rx="18" fill="#ffffff" opacity="0.45"/>
  <rect x="136" y="48"  width="72" height="72" rx="18" fill="#ffffff"/>

  <!-- play triangle on the pressed pad -->
  <path d="M 162 66 L 194 84 L 162 102 Z" fill="#3a55e8"/>
</svg>
